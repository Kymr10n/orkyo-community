name: CI

# Triggers:
#   pull_request to main     — security audits + build + test + smoke (no push)
#   push to main             — + build images (sha) + container scan
#   push to v* tags          — + assemble release bundle + smoke-selfhosted + GH Release
#   workflow_dispatch        — manual run
#   repository_dispatch      — fired by orkyo-foundation when a new package is published.
#                              Runs auto-bump only; build/test/smoke are skipped because they
#                              would test the pre-bump Foundation version. The bump commit
#                              (push to main) triggers a full CI run against the new version.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    # Nightly build. The nightly-change-check job below skips the run when main
    # is unchanged since the last successful scheduled build, so this only does a
    # full build/scan when there is something new to validate.
    - cron: '30 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [foundation_updated]

concurrency:
  # repository_dispatch runs report github.ref = refs/heads/main, so they used to share a
  # group with pushes to main: a dispatch could cancel an in-flight push build (and vice
  # versa), and a same-window nightly + stable foundation_updated dispatch could cancel each
  # other, unordered. Key dispatch runs by channel instead, and never cancel one — the
  # auto-bump it produces is idempotent, so a redundant dispatch queues harmlessly.
  group: >-
    release-ci-${{ github.event_name == 'repository_dispatch'
      && format('bump-{0}', github.event.client_payload.channel)
      || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

permissions: {}

env:
  REGISTRY: ghcr.io/kymr10n
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # NIGHTLY CHANGE CHECK
  # ─────────────────────────────────────────────
  nightly-change-check:
    name: Nightly Change Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Determine whether to skip pipeline
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('skip', 'false');
              return;
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-ci.yml',
              event: 'schedule',
              status: 'success',
              per_page: 1,
            });
            if (runs.workflow_runs.length === 0) {
              core.setOutput('skip', 'false');
              return;
            }
            const lastSha = runs.workflow_runs[0].head_sha;
            const skip = lastSha === context.sha ? 'true' : 'false';
            core.setOutput('skip', skip);
            if (skip === 'true') core.notice('No changes since last nightly — skipping pipeline');


  # ─────────────────────────────────────────────
  # DEPENDENCY REVIEW — PRs only
  # ─────────────────────────────────────────────
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
  # ─────────────────────────────────────────────
  # CHANGE DETECTION — gates backend-ci / frontend-ci on PRs
  # ─────────────────────────────────────────────
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [nightly-change-check]
    if: needs.nightly-change-check.outputs.skip == 'false'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Path filter (PR only — push/dispatch always run both)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Directory.Build.props'
              - 'global.json'
              - 'nuget.config'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────
  # SECURITY AUDITS — three parallel jobs, all gate downstream builds
  # ─────────────────────────────────────────────
  audit-secrets:
    needs: [nightly-change-check]
    if: needs.nightly-change-check.outputs.skip == 'false'
    permissions:
      contents: read
      security-events: write
      pull-requests: read  # ceiling: reusable-audit-secrets' job requests it (gitleaks PR scan)
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-audit-secrets.yml@a367c8115f0c402dc8535fd15e15629ad9b03860
    with:
      migration-lint-path: backend/migrations/sql
      run-iac-scan: true
    secrets: inherit

  audit-nuget:
    needs: [nightly-change-check]
    if: needs.nightly-change-check.outputs.skip == 'false'
    permissions:
      contents: read
      packages: read
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-audit-nuget.yml@52096ef653daba7eb45d360d4901013d06a2a3cf
    with:
      solution-path: Orkyo.Community.slnx
      with-private-registry: true
    secrets: inherit

  audit-npm:
    needs: [nightly-change-check]
    if: needs.nightly-change-check.outputs.skip == 'false'
    permissions:
      contents: read
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-audit-npm.yml@a367c8115f0c402dc8535fd15e15629ad9b03860
    with:
      with-private-registry: true
      # DELIBERATE: license scan ON — Community is distributed (AGPL self-host
      # bundle), so the licenses of shipped dependencies must be checked.
      # SaaS keeps it off (hosted, not distributed).
      with-license-scan: true
    secrets: inherit

  # ─────────────────────────────────────────────
  # BACKEND CI
  # ─────────────────────────────────────────────
  backend-ci:
    name: backend-ci
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [audit-secrets, audit-nuget, audit-npm, detect-changes]
    if: >-
      github.event_name != 'repository_dispatch' &&
      needs.detect-changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/Kymr10n/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-community-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-community-

      # No lock files here on purpose, so no locked-mode flag either. This repo restores
      # in TWO shapes: locally the sibling orkyo-foundation checkout is used through
      # ProjectReference, while CI resolves Orkyo.* from the package feed. Those are
      # different dependency graphs, and a packages.lock.json can only record one — a file
      # generated by a local restore would fail every CI restore, and vice versa. Foundation
      # has no such split and does use lock files with locked-mode.
      - name: Restore
        run: dotnet restore Orkyo.Community.slnx

      - name: Format check
        run: dotnet format Orkyo.Community.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Orkyo.Community.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test Orkyo.Community.slnx \
            -c Release --no-build \
            --verbosity normal \
            --logger GitHubActions \
            --collect:"XPlat Code Coverage" \
            --results-directory backend/TestResults

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: backend/TestResults
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # FRONTEND CI
  # ─────────────────────────────────────────────
  frontend-ci:
    name: frontend-ci
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [audit-secrets, audit-nuget, audit-npm, detect-changes]
    if: >-
      github.event_name != 'repository_dispatch' &&
      needs.detect-changes.outputs.frontend == 'true'

    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure npm for GitHub Packages (@kymr10n/foundation)
        run: |
          echo "@kymr10n:registry=https://npm.pkg.github.com" > frontend/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GHCR_TOKEN }}" >> frontend/.npmrc

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify foundation package is installed
        # Fails fast with a clear message if the registry/auth ever silently
        # drops @kymr10n/foundation, instead of letting downstream lint surface
        # cryptic "type 'X' is an 'error' type" errors.
        run: |
          test -d node_modules/@kymr10n/foundation \
            || (echo "::error::@kymr10n/foundation is not installed — check npm registry auth" && exit 1)
          npm run check:foundation-imports
          npm run check:dedupe-sync
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: frontend/coverage/cobertura-coverage.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # SMOKE TESTS — gates image builds
  # ─────────────────────────────────────────────
  smoke-tests:
    name: smoke-tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, nightly-change-check]
    if: >-
      !failure() && !cancelled() &&
      github.event_name != 'repository_dispatch' &&
      needs.nightly-change-check.outputs.skip == 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/Kymr10n/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No lock files here on purpose, so no locked-mode flag either. This repo restores
      # in TWO shapes: locally the sibling orkyo-foundation checkout is used through
      # ProjectReference, while CI resolves Orkyo.* from the package feed. Those are
      # different dependency graphs, and a packages.lock.json can only record one — a file
      # generated by a local restore would fail every CI restore, and vice versa. Foundation
      # has no such split and does use lock files with locked-mode.
      - name: Restore
        run: dotnet restore Orkyo.Community.slnx

      - name: Build
        run: dotnet build Orkyo.Community.slnx -c Release --no-restore

      - name: Validate config contract
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=orkyo_community_ci;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://+:5002"
          CORS_ALLOWED_ORIGINS: "http://localhost:5002"
          KEYCLOAK_URL: "http://localhost:8082"
          KEYCLOAK_REALM: "orkyo-community"
          KEYCLOAK_BACKEND_CLIENT_ID: "orkyo-backend"
          KEYCLOAK_BACKEND_CLIENT_SECRET: "ci-secret"
          OIDC_AUTHORITY: "http://localhost:8082/realms/orkyo-community"
          JWT_ISSUER: "orkyo-api"
          JWT_AUDIENCE: "orkyo-app"
          JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USE_SSL: "false"
          SMTP_FROM_EMAIL: "noreply@ci.local"
          SMTP_FROM_NAME: "Orkyo CI"
          APP_BASE_URL: "http://localhost:5002"
          VALKEY_CONNECTION: "localhost:6379,abortConnect=false"
          ORKYO_MASTER_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          dotnet run --no-build -c Release \
            --project backend/api/Orkyo.Community.Api.csproj \
            -- --validate

      - name: Create tenant database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE orkyo_community_ci;" || true

      - name: Run migrator
        env:
          DEFAULT_CONNECTION_STRING: "Host=localhost;Port=5432;Database=orkyo_community_ci;Username=postgres;Password=postgres"
          APP_VERSION: ci-${{ github.sha }}
        run: |
          dotnet run --no-build -c Release \
            --project backend/migrator/Orkyo.Community.Migrator.csproj \
            -- migrate --target all
          dotnet run --no-build -c Release \
            --project backend/migrator/Orkyo.Community.Migrator.csproj \
            -- migrate --target all
          dotnet run --no-build -c Release \
            --project backend/migrator/Orkyo.Community.Migrator.csproj \
            -- validate --target all

      - name: Start API and verify health
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=orkyo_community_ci;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://+:5002"
          CORS_ALLOWED_ORIGINS: "http://localhost:5002"
          KEYCLOAK_URL: "http://localhost:8082"
          KEYCLOAK_REALM: "orkyo-community"
          KEYCLOAK_BACKEND_CLIENT_ID: "orkyo-backend"
          KEYCLOAK_BACKEND_CLIENT_SECRET: "ci-secret"
          OIDC_AUTHORITY: "http://localhost:8082/realms/orkyo-community"
          JWT_ISSUER: "orkyo-api"
          JWT_AUDIENCE: "orkyo-app"
          JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USE_SSL: "false"
          SMTP_FROM_EMAIL: "noreply@ci.local"
          SMTP_FROM_NAME: "Orkyo CI"
          APP_BASE_URL: "http://localhost:5002"
          VALKEY_CONNECTION: "localhost:6379,abortConnect=false"
          ORKYO_MASTER_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          dotnet run --no-build -c Release \
            --project backend/api/Orkyo.Community.Api.csproj \
            > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          for i in $(seq 1 30); do
            if curl -sf http://localhost:5002/health/live >/dev/null 2>&1; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"; tail -n 100 /tmp/api.log; exit 1

      - name: Teardown
        if: always()
        run: |
          [ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  # ─────────────────────────────────────────────
  # BUILD IMAGES — main + v* tags, after smoke
  # ─────────────────────────────────────────────
  build-images:
    name: Build Images (${{ matrix.service }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: backend/api/Dockerfile
          - service: worker
            dockerfile: backend/worker/Dockerfile
          - service: migrator
            dockerfile: backend/migrator/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            no_secret: true
          - service: keycloak
            dockerfile: backend/keycloak/Dockerfile
            context: .
            no_secret: true
            build_args: "FOUNDATION_KC_IMAGE=ghcr.io/kymr10n/keycloak:26.6-orkyo-security-refresh"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push (backend)
        if: matrix.no_secret != true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/orkyo-community-${{ matrix.service }}:sha-${{ github.sha }}
          secrets: nuget_token=${{ secrets.GHCR_TOKEN }}
          cache-from: type=gha,scope=community-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=community-${{ matrix.service }}

      - name: Build and push (frontend/keycloak — needs GHCR_TOKEN)
        if: matrix.no_secret == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/orkyo-community-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          secrets: ghcr_token=${{ secrets.GHCR_TOKEN }}
          cache-from: type=gha,scope=community-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=community-${{ matrix.service }}

  # ─────────────────────────────────────────────
  # CONTAINER SCAN
  # ─────────────────────────────────────────────
  container-scan:
    needs: [build-images]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-container-scan.yml@a367c8115f0c402dc8535fd15e15629ad9b03860
    with:
      image-name-prefix: orkyo-community
      services: '["api","worker","migrator","frontend","keycloak"]'
      java-services: '["keycloak"]'
    secrets: inherit

  # ─────────────────────────────────────────────
  # RELEASE BUNDLE + SMOKE + GH RELEASE — v* only
  # ─────────────────────────────────────────────
  assemble-selfhosted:
    name: Assemble Release Bundle
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: >-
      !failure() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAJOR=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "MINOR=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Provenance gate — verify all SHA images exist
        run: |
          for svc in api worker migrator frontend keycloak; do
            IMAGE="${{ env.REGISTRY }}/orkyo-community-${svc}:sha-${{ github.sha }}"
            echo "Checking: $IMAGE"
            if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "::error::SHA image not found: $IMAGE"
              echo "::error::Push to main must succeed before creating a release tag"
              exit 1
            fi
          done

      - name: Re-tag images (no rebuild)
        env:
          V: ${{ steps.version.outputs.VERSION }}
          MINOR: ${{ steps.version.outputs.MINOR }}
          MAJOR: ${{ steps.version.outputs.MAJOR }}
        run: |
          for svc in api worker migrator frontend keycloak; do
            SHA_IMG="${{ env.REGISTRY }}/orkyo-community-${svc}:sha-${{ github.sha }}"
            docker pull "$SHA_IMG"
            for tag in "$V" "$MINOR" "$MAJOR"; do
              docker tag "$SHA_IMG" "${{ env.REGISTRY }}/orkyo-community-${svc}:${tag}"
              docker push "${{ env.REGISTRY }}/orkyo-community-${svc}:${tag}"
            done
          done

      - name: Assemble release bundle
        run: bash scripts/ci/assemble-release.sh "${{ steps.version.outputs.VERSION }}" dist

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/
          retention-days: 1

  smoke-selfhosted:
    name: Smoke — Self-Hosted Bundle
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [assemble-selfhosted]
    if: >-
      !failure() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c "orkyo-community-v${{ steps.version.outputs.VERSION }}.zip.sha256"

      - name: Unpack bundle
        run: |
          cd dist
          unzip "orkyo-community-v${{ steps.version.outputs.VERSION }}.zip"

      - name: Generate test .env
        run: |
          BUNDLE="dist/orkyo-community-v${{ steps.version.outputs.VERSION }}"
          cat > "$BUNDLE/.env" <<'EOF'
          POSTGRES_USER=orkyo
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=orkyo_community
          KEYCLOAK_DB=keycloak
          VALKEY_PASSWORD=ci-valkey-password
          ORKYO_MASTER_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_BASE_URL=http://localhost
          KEYCLOAK_URL=http://localhost:9080
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-keycloak-admin-password
          KEYCLOAK_REALM=orkyo-community
          KEYCLOAK_BACKEND_CLIENT_ID=orkyo-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET=ci-backend-client-secret
          BFF_COOKIE_DOMAIN=localhost
          BFF_COOKIE_SECURE=false
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USE_SSL=false
          SMTP_FROM_EMAIL=noreply@ci.local
          SMTP_FROM_NAME=Orkyo CI
          EOF
          # compose.yml pins images via fail-fast ${ORKYO_VERSION:?}; take the
          # value from the stamped .env.template so the smoke also proves the
          # bundle assembly stamped the released version correctly.
          grep '^ORKYO_VERSION=' "$BUNDLE/.env.template" >> "$BUNDLE/.env"
          grep -q "^ORKYO_VERSION=${{ steps.version.outputs.VERSION }}$" "$BUNDLE/.env" \
            || (echo "::error::.env.template was not stamped with ${{ steps.version.outputs.VERSION }}" && exit 1)

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Start full stack (incl. Keycloak — exercises baked realm import)
        working-directory: dist/orkyo-community-v${{ steps.version.outputs.VERSION }}
        run: docker compose up -d

      - name: Wait for Keycloak to import realm and be ready
        working-directory: dist/orkyo-community-v${{ steps.version.outputs.VERSION }}
        run: |
          echo "Waiting for Keycloak (timeout 180s) — exercises baked realm import..."
          if timeout 180 bash -c \
            'until curl -sf -o /dev/null http://localhost:9080/realms/orkyo-community; do sleep 3; done'; then
            echo "Keycloak realm available"
          else
            echo "::error::Keycloak failed to start or import realm within 180s"
            docker compose logs keycloak --tail 100
            exit 1
          fi

      - name: Wait for API to be healthy
        working-directory: dist/orkyo-community-v${{ steps.version.outputs.VERSION }}
        run: |
          echo "Waiting for API (timeout 120s)..."
          if timeout 120 bash -c \
            'until curl -sf http://localhost:8080/health >/dev/null 2>&1; do sleep 3; done'; then
            echo "API healthy"
          else
            echo "::error::API did not become healthy within 120s"
            docker compose logs --tail 50
            exit 1
          fi

      - name: Verify frontend serves
        run: curl -sf http://localhost/ | grep -q html || (echo "::error::Frontend not responding"; exit 1)

      - name: Verify CSS is not Tailwind-purged
        # Catches the bug where the npm-dist Tailwind @source path is missing from src/index.css,
        # causing all foundation component classes to be purged during Docker build (12KB stub vs ≥30KB full).
        run: |
          INDEX=$(curl -sf http://localhost/)
          CSS_FILE=$(echo "$INDEX" | grep -oP '(?<=/assets/)[^"]+\.css' | head -1)
          if [ -z "$CSS_FILE" ]; then
            echo "::error::No CSS file referenced in index.html"; exit 1
          fi
          CSS_SIZE=$(curl -sf "http://localhost/assets/$CSS_FILE" | wc -c)
          if [ "$CSS_SIZE" -lt 30000 ]; then
            echo "::error::CSS too small (${CSS_SIZE}B < 30KB) — foundation Tailwind classes were purged from the build"
            exit 1
          fi
          echo "CSS OK: $CSS_FILE (${CSS_SIZE}B)"

      - name: Verify Keycloak Orkyo theme is present
        # Catches the bug where the KC image doesn't include the Orkyo theme
        # (bare upstream image used instead of the foundation-based one).
        run: |
          LOGIN_URL="http://localhost:9080/realms/orkyo-community/protocol/openid-connect/auth?client_id=orkyo-backend&response_type=code&scope=openid&redirect_uri=http%3A%2F%2Flocalhost"
          LOGIN_HTML=$(curl -sf "$LOGIN_URL" || true)
          THEME_CSS=$(echo "$LOGIN_HTML" | grep -oP '(?<=href=")[^"]*orkyo[^"]*\.css' | head -1)
          if [ -z "$THEME_CSS" ]; then
            echo "::error::No Orkyo theme CSS found in Keycloak login page — theme missing from image"
            echo "Page excerpt:"; echo "$LOGIN_HTML" | head -30
            exit 1
          fi
          echo "Theme CSS URL: $THEME_CSS"
          # Keycloak emits a root-relative href; resolve it against the KC origin
          # before fetching (curl needs an absolute URL).
          case "$THEME_CSS" in
            http*) THEME_URL="$THEME_CSS" ;;
            *)     THEME_URL="http://localhost:9080$THEME_CSS" ;;
          esac
          HTTP=$(curl -sk -o /dev/null -w "%{http_code}" "$THEME_URL")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Keycloak theme CSS returned HTTP $HTTP: $THEME_URL"; exit 1
          fi
          echo "Keycloak theme CSS: OK ($HTTP)"

      - name: Verify nginx /auth/ proxy path
        # Catches the bug where the nginx location ^~ /auth/ rule is missing,
        # causing the regex .css/.js location to intercept Keycloak theme assets.
        # Also catches any keycloak routing misconfiguration.
        run: |
          HTTP=$(curl -sk -o /dev/null -w "%{http_code}" \
            "http://localhost/auth/realms/orkyo-community/.well-known/openid-configuration")
          if [ "$HTTP" != "200" ]; then
            echo "::error::nginx /auth/ proxy returned HTTP $HTTP — check ^~ location rule and keycloak routing"
            exit 1
          fi
          echo "/auth/ proxy path: OK ($HTTP)"

      - name: Verify worker is running
        working-directory: dist/orkyo-community-v${{ steps.version.outputs.VERSION }}
        run: |
          echo "Waiting for worker to stabilise (timeout 60s)..."
          deadline=$((SECONDS + 60))
          while [ $SECONDS -lt $deadline ]; do
            state=$(docker inspect --format '{{.State.Status}}' \
              "$(docker compose ps -q worker)" 2>/dev/null)
            if [ "$state" = "running" ]; then
              echo "Worker running"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Worker is not running — likely a startup crash (state: $state)"
          docker compose logs worker --tail 50
          exit 1

      - name: Teardown
        if: always()
        working-directory: dist/orkyo-community-v${{ steps.version.outputs.VERSION }}
        run: docker compose down -v

  create-release:
    name: Create GitHub Release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [smoke-selfhosted]
    if: >-
      !failure() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*-${{ github.sha }}
          path: sboms/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stable-named alias so `releases/latest/download/orkyo-community.zip` always resolves
          # (the versioned asset can't be fetched via the /latest/ URL).
          cp "dist/orkyo-community-v${{ steps.version.outputs.VERSION }}.zip" dist/orkyo-community.zip
          gh release create "${{ github.ref_name }}" \
            dist/orkyo-community-v${{ steps.version.outputs.VERSION }}.zip \
            dist/orkyo-community.zip \
            dist/orkyo-community-v${{ steps.version.outputs.VERSION }}.zip.sha256 \
            sboms/*.spdx.json \
            --generate-notes \
            --title "Orkyo Community ${{ github.ref_name }}"

  # ─────────────────────────────────────────────
  # AUTO-BUMP — fires on every foundation publish (nightly + stable)
  #
  # Commits the new Foundation pin directly to main. build/test/smoke are
  # intentionally skipped in the dispatch run (they would test the pre-bump
  # version). The resulting push to main triggers a full CI run against the
  # new Foundation version — if Foundation broke us, main goes red immediately.
  # ─────────────────────────────────────────────
  auto-bump:
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: write
      issues: write
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-auto-bump.yml@a367c8115f0c402dc8535fd15e15629ad9b03860
    secrets: inherit

  # ─────────────────────────────────────────────
  # EVIDENCE BUNDLE — always
  # ─────────────────────────────────────────────
  release-evidence-bundle:
    name: Release Evidence
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
      - nightly-change-check
      - audit-secrets
      - audit-nuget
      - audit-npm
      - backend-ci
      - frontend-ci
      - smoke-tests
      - build-images
      - container-scan
      - assemble-selfhosted
      - smoke-selfhosted
      - create-release
      - auto-bump
    if: always()

    permissions:
      contents: read
    steps:
      - name: Collect job results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const lines = ['# Release Evidence Bundle', '',
              `**Run:** ${context.runId}`, `**SHA:** ${context.sha}`,
              `**Ref:** ${context.ref}`, `**Event:** ${context.eventName}`,
              '', '## Job Results', ''];
            for (const [job, result] of Object.entries(jobs)) {
              const icon = result.result === 'success' ? '✅'
                : result.result === 'skipped' ? '⏭️' : '❌';
              lines.push(`${icon} **${job}**: ${result.result}`);
            }
            await core.summary.addRaw(lines.join('\n')).write();
