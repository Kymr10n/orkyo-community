name: Dependabot auto-merge

# The job body lives in foundation's reusable-dependabot-auto-merge.yml, pinned by SHA
# like every other reusable here. What stays here is the trigger and the repo-specific
# deploy answer below.
#
# WHY pull_request_target AND NOT pull_request: pull_request_target evaluates this file
# from the base branch, so a pull request cannot change what runs with AUTOMERGE_TOKEN.
# The usual danger of that trigger is checking out and running untrusted pull-request
# code — this job checks out nothing and runs nothing from the pull request, so that
# risk is not present.
#
# THIS CANNOT DEPLOY. A merge to main here builds sha-tagged images and nothing else;
# deployment happens only through orkyo-infra's deploy.yml, dispatched deliberately,
# and the self-hosted bundle is cut only from version tags.

on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: read
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-dependabot-auto-merge.yml@705f5fc9cf24825e010a5971348011fd1f9d18f7
    secrets: inherit
