name: Freshness report

# Monthly, one tracking issue: packages a major behind, the majors dependabot.yml
# ignores, runtimes near end of support, Dependabot PRs older than 14 days. The job
# body lives in foundation's reusable-freshness-report.yml, pinned by SHA.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  freshness-report:
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    uses: Kymr10n/orkyo-foundation/.github/workflows/reusable-freshness-report.yml@705f5fc9cf24825e010a5971348011fd1f9d18f7
    with:
      solution-path: Orkyo.Community.slnx
      with-private-registry: true
      # The Keycloak base in backend/keycloak/Dockerfile follows the foundation release,
      # not Dependabot; list it so a stale minor is visible here.
      extra-eol: |
        Keycloak (foundation image)|26.7 via FOUNDATION_KC_IMAGE|unknown|moves with the foundation bump; upstream supports only the newest minor
    secrets: inherit
