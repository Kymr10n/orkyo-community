# Keeps the digest-pinned base images in the Dockerfiles fresh (W0.7 / CO-2):
# the runtime bases are pinned by sha256 digest, so without automation every
# upstream rebuild silently ages our pins until trivy findings pile up.
# backend/keycloak/Dockerfile is excluded — its base comes from the
# FOUNDATION_KC_IMAGE build arg, not a pinned digest.
# Also covers NuGet (central versions in Directory.Packages.props), npm, and
# the SHA-pinned GitHub Actions in workflows.
#
# Each ecosystem raises at most three pull requests per run: one batching all
# minor and patch updates, one batching majors, and one batching the bumps that
# carry no semver update-type at all (digests, SHA pins). Majors are grouped,
# never ignored — an ignore rule also suppresses the security pull request when
# an advisory is only fixed in a new major. `applies-to: version-updates` keeps
# Dependabot security updates out of the groups, so an advisory-driven fix
# arrives on its own and immediately.
#
# GROUP ORDER MATTERS. A dependency joins the FIRST group it matches, so the
# patterns-only catch-all must stay last — above it, the update-types filters
# claim majors and minor/patch first.
#
# SCHEDULE IS STAGGERED across the four repos, one weekday each, two hours
# between ecosystems: infra Monday, foundation Tuesday, saas Wednesday,
# community Thursday. Six Dependabot runs starting in the same minute is what
# rate-limited codeload and failed six saas pull requests at "Set up job" with
# HTTP 429 on 2026-08-17; this repo raised the same six and only escaped by
# firing in a quieter window.
#
# NO AUTO-MERGE IN THIS REPO — a decision, not a gap. main-protection carries a
# pull_request rule (one approving review + a code-owner review), and GitHub's
# deferred auto-merge path does NOT re-check ruleset bypass_actors when it
# completes: the pull request stays BLOCKED / REVIEW_REQUIRED for good, even
# with the bot listed as a bypass actor. Calling the merge endpoint directly
# succeeds for the same actor, which isolates it to the auto-merge path. GitHub
# support has said engineering will not resolve it in the near term.
#   https://github.com/orgs/community/discussions/162623
#   https://github.com/orgs/community/discussions/142206
#
# Two workarounds were considered and rejected. Dropping the pull_request rule
# weakens the gate for human pull requests too, to serve a bot. A
# workflow_run-triggered direct merge needs a github-actions[bot] bypass, which
# is a wider hole than the Dependabot one, and puts real complexity in a merge
# path. The grouping above already cuts this repo to roughly one pull request
# per ecosystem per week, so the remaining manual merge is cheap. Revisit only
# if GitHub fixes the bypass.
#
# orkyo-saas and orkyo-infra have no pull_request rule on main, so auto-merge
# completes there and is enabled in those two repos.
version: 2

# The Orkyo.* packages live on GitHub Packages, not nuget.org. Without these
# credentials Dependabot cannot restore the dependency graph at all, so the whole
# nuget run aborts and NO update is raised — which is why this repo saw docker and
# npm pull requests but never a nuget one.
# The token is a Dependabot-scoped secret (Settings → Secrets and variables →
# Dependabot), separate from Actions secrets, and needs only `read:packages`.
registries:
  orkyo-github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/Kymr10n/index.json
    username: Kymr10n
    password: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: docker
    directories:
      - /backend/api
      - /backend/worker
      - /backend/migrator
      - /frontend
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"

    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      docker-digest:
        # A digest-only bump has no semver update-type, so it matches neither group
        # above and Dependabot raises one pull request PER DIRECTORY — four identical
        # dotnet/sdk bumps in this repo before this group existed. Patterns-only
        # catches them and batches them into one.
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    registries:
      - orkyo-github-packages
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"

    # The Orkyo.* pins resolve from $(OrkyoFoundationVersion) in Directory.Build.props
    # and are owned by the release train (reusable-auto-bump.yml). Dependabot would
    # replace that property reference with a literal version and race the train.
    ignore:
      - dependency-name: "Orkyo.*"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      nuget-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"

    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"

    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      actions-digest:
        # Same failure mode the docker-digest group above fixes, for Actions.
        # The reusable workflows this repo calls from orkyo-foundation are
        # referenced by commit SHA, not by tag, so they resolve to no semver
        # release, carry no update-type, and match neither group above. Before
        # this group they arrived as one pull request PER WORKFLOW FILE — six of
        # them on 2026-08-17 (#90–#95). Patterns-only batches them into one.
        applies-to: version-updates
        patterns: ["*"]
