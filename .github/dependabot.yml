# Keeps the digest-pinned base images in the Dockerfiles fresh (W0.7 / CO-2):
# the runtime bases are pinned by sha256 digest, so without automation every
# upstream rebuild silently ages our pins until trivy findings pile up.
# backend/keycloak/Dockerfile is excluded — its base comes from the
# FOUNDATION_KC_IMAGE build arg, which the foundation bump script moves.
# Also covers the self-host bundle's compose pins, NuGet (central versions in
# Directory.Packages.props), npm, and the SHA-pinned GitHub Actions in workflows.
#
# SHAPE. Per ecosystem and week: ONE pull request batching every minor and patch
# update, ONE per major (majors are deliberately ungrouped — a group holding one
# upstream-blocked major blocked four others for a month), and for digest-only
# bumps ONE patterns-only catch-all. Security updates have their own group per
# ecosystem (`applies-to: security-updates`) so an advisory arrives as one PR, at
# once, and never waits for the cooldown.
#
# COOLDOWN. Three days for minor, patch and digest bumps, seven for majors: most
# compromised releases are pulled from the registry within days. Security updates
# are exempt by Dependabot's own rule.
#
# GROUP ORDER MATTERS. A dependency joins the FIRST group it matches, so the
# patterns-only catch-all must stay last — above it, the update-types filter
# claims minor/patch first. Majors match no version-update group and open alone.
#
# SCHEDULE IS STAGGERED across the four repos, one weekday each, two hours
# between ecosystems: infra Monday, foundation Tuesday, saas Wednesday,
# community Thursday. Six Dependabot runs starting in the same minute is what
# rate-limited codeload and failed six saas pull requests at "Set up job" with
# HTTP 429 on 2026-08-17; this repo raised the same six and only escaped by
# firing in a quieter window.
#
# AUTO-MERGE. dependabot-auto-merge.yml approves and queues a squash merge for
# every non-major pull request. The approval (owner token, CODEOWNERS is the owner)
# satisfies the main ruleset's review rule, so the queued merge completes once the
# required checks pass. Majors are never auto-merged. GitHub's deferred auto-merge
# does not re-check ruleset bypass actors, so a bypass would not work — the review
# itself is what unblocks it:
#   https://github.com/orgs/community/discussions/162623
#
# IGNORED MAJORS are upstream-blocked, not unwanted. Each entry names the blocker.
# The monthly freshness report lists them so they are re-checked, and the entry is
# dropped the moment the blocker ships.
#
# NOT TRACKED: compose.local.yml. Dependabot's docker-compose ecosystem only reads
# files named compose.y(a)ml or docker-compose.y(a)ml, so the local postgres, valkey
# and mailhog pins move by hand (or with the CI service pins in foundation's
# reusable-product-ci.yml, which use the same digests).
version: 2

# The Orkyo.* NuGet packages and @kymr10n/foundation live on GitHub Packages, not
# on nuget.org or npmjs. Without credentials Dependabot cannot restore the dependency
# graph at all, so the whole run aborts and NO update is raised.
# The token is a Dependabot-scoped secret (Settings → Secrets and variables →
# Dependabot), separate from Actions secrets, and needs only `read:packages`.
registries:
  orkyo-github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/Kymr10n/index.json
    username: Kymr10n
    password: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
  orkyo-github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: docker
    directories:
      - /backend/api
      - /backend/worker
      - /backend/migrator
      - /frontend
    # A conventional subject so the bump is exempt from the docs-impact trailer rule by
    # type (`build:`), instead of escaping it by having no type at all.
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    # Four directories; a digest bump is one PR across all of them, a major one per image.
    open-pull-requests-limit: 10
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-digest:
        # A digest-only bump has no semver update-type, so it matches no group
        # above and Dependabot raises one pull request PER DIRECTORY. Patterns-only
        # catches them and batches them into one.
        applies-to: version-updates
        patterns: ["*"]

  # The self-host bundle pins its third-party images by digest; this keeps the
  # pins moving with upstream the same way the Dockerfiles above do. A major here
  # (postgres, valkey) is a data migration for every self-hoster, so it opens alone
  # and is never auto-merged.
  - package-ecosystem: docker-compose
    directory: /release
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
      compose-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compose-digest:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    registries:
      - orkyo-github-packages
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    # The Orkyo.* pins resolve from $(OrkyoFoundationVersion) in Directory.Build.props
    # and are owned by the release train (reusable-auto-bump.yml). Dependabot would
    # replace that property reference with a literal version and race the train.
    ignore:
      - dependency-name: "Orkyo.*"
    open-pull-requests-limit: 5
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
      nuget-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    registries:
      - orkyo-github-npm
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    ignore:
      # @kymr10n/foundation is pinned by the release train (bump-foundation), same as
      # the Orkyo.* NuGet packages above.
      - dependency-name: "@kymr10n/*"
      # FullCalendar 7 folded the daygrid/timegrid/list/interaction plugins into
      # `@fullcalendar/react/*` subpaths, so a bump of core+react alone cannot resolve.
      # The calendar lives in orkyo-foundation; the v7 move is a foundation change first.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: typescript-eslint supports typescript <6.1.0.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react 7.37.5 (latest) accepts eslint ^9.7 at most.
      # @eslint/js moves with eslint.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Vitest 5 changed Assertion to two type parameters; @testing-library/jest-dom
      # 7.0.1 no longer augments it (testing-library/jest-dom#738, fix in #742).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-digest:
        # The reusable workflows this repo calls from orkyo-foundation are referenced
        # by commit SHA, not by tag, so they resolve to no semver release, carry no
        # update-type, and match no group above. Before this group they arrived as one
        # pull request PER WORKFLOW FILE — six of them on 2026-08-17 (#90–#95).
        # Patterns-only batches them into one.
        applies-to: version-updates
        patterns: ["*"]
